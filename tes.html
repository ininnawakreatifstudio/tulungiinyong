<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diagnostik Pesanan • INYONG_JEK</title>
<style>
  body{font-family:system-ui;background:#f6f9f6;color:#0f172a;padding:16px;margin:0}
  .row{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:12px;margin-bottom:8px}
  .ok{border-left:4px solid #0f9d58}.fail{border-left:4px solid #dc2626}.warn{border-left:4px solid #e8ad00}
  .t{font-weight:800;font-size:14px}.d{font-size:12px;color:#475569;white-space:pre-wrap;margin-top:4px;font-family:monospace}
  h1{font-size:18px}button{background:#0f9d58;color:#fff;border:0;padding:10px 16px;border-radius:9px;font-weight:800;cursor:pointer;margin-top:8px}
</style>
</head>
<body>
<h1>🧪 Diagnostik Buat Pesanan</h1>
<button onclick="run()">Jalankan Tes</button>
<div id="hasil"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAXWxcWYhvEKlXC414ECmv0vG0jZAr_Ecc",
  authDomain: "tulungiiyong.firebaseapp.com",
  projectId: "tulungiiyong",
  storageBucket: "tulungiiyong.firebasestorage.app",
  messagingSenderId: "892623147541",
  appId: "1:892623147541:web:47812250f6498efad7b41c"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

window.run = async function(){
  const out = document.getElementById('hasil');
  out.innerHTML = '';
  const log = (t, s, d) => {
    const div = document.createElement('div');
    div.className = 'row ' + s;
    div.innerHTML = '<div class="t">' + (s==='ok'?'✅':s==='warn'?'⚠️':'❌') + ' ' + t + '</div>' + (d?'<div class="d"></div>':'');
    if (d) div.querySelector('.d').textContent = d;
    out.appendChild(div);
  };

  // 1. Auth
  const user = auth.currentUser;
  log('1. Status Login (Auth)', user ? 'ok' : 'fail',
    user ? 'SUDAH login. UID: ' + user.uid : 'BELUM login (request.auth kosong). Ini penyebab "permission denied". Login ulang lewat index.html.');

  // 2. Session
  let session = {};
  try { session = JSON.parse(localStorage.getItem('tulungiyong.session')) || {}; } catch {}
  const uid = session.uid || session.id;
  log('2. Session lokal', uid ? 'ok' : 'fail',
    uid ? 'role: ' + session.role + ' · name: ' + (session.name||'-') + ' · uid: ' + uid
        : 'Session kosong. Belum login.');

  // 3. User doc status
  if (uid) {
    try {
      const snap = await getDoc(doc(db, 'users', uid));
      if (snap.exists()) {
        const d = snap.data();
        log('3. Data akun', d.status === 'active' ? 'ok' : 'warn',
          'status: ' + d.status + ' · role: ' + d.role +
          (d.status !== 'active' ? '\n⚠️ status bukan "active" (masih ' + d.status + '). Order TIDAK bisa dibuat. Verifikasi dulu akun ini.' : ''));
      } else {
        log('3. Data akun', 'fail', 'Dokumen users/' + uid + ' TIDAK ada.');
      }
    } catch (e) { log('3. Data akun', 'fail', e.code + ' ' + e.message); }
  } else {
    log('3. Data akun', 'fail', 'Tidak bisa cek karena session kosong.');
  }

  // 4. Test create order
  if (uid) {
    try {
      const ref = await addDoc(collection(db, 'orders'), {
        userId: uid, userName: session.name || 'Test', userWa: session.wa || '',
        serviceId: 'ojek', serviceName: 'Tes Diagnostik', status: 'pending',
        createdAt: serverTimestamp(), paymentMethod: 'cash', fare: 0, paymentTotal: 0
      });
      log('4. Buat pesanan test', 'ok', 'BERHASIL (id: ' + ref.id + '). Rules sudah benar. Hapus pesanan "Tes Diagnostik" ini di Firestore ya.');
    } catch (e) {
      log('4. Buat pesanan test', 'fail', e.code + '\n' + e.message);
    }
  } else {
    log('4. Buat pesanan test', 'fail', 'Lewat (belum login).');
  }
};
</script>
</body>
</html>
