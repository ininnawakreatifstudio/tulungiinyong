<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diagnostik Pesanan Lengkap</title>
<style>
  body{font-family:system-ui;background:#f6f9f6;color:#0f172a;padding:16px;margin:0}
  .row{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:12px;margin-bottom:8px}
  .ok{border-left:4px solid #0f9d58}.fail{border-left:4px solid #dc2626}
  .t{font-weight:800;font-size:14px}.d{font-size:12px;color:#475569;white-space:pre-wrap;margin-top:4px;font-family:monospace}
  h1{font-size:18px}button{background:#0f9d58;color:#fff;border:0;padding:10px 16px;border-radius:9px;font-weight:800;cursor:pointer;margin-top:8px}
</style>
</head>
<body>
<h1>🧪 Diagnostik Pesanan Lengkap</h1>
<button onclick="run()">Jalankan Tes</button>
<div id="hasil"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAXWxcWYhvEKlXC414ECmv0vG0jZAr_Ecc",
  authDomain: "tulungiiyong.firebaseapp.com",
  projectId: "tulungiiyong",
  storageBucket: "tulungiiyong.firebasestorage.app",
  messagingSenderId: "892623147541",
  appId: "1:892623147541:web:47812250f6498efad7b41c"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.run = async function(){
  const out = document.getElementById('hasil');
  out.innerHTML = '';
  const log = (t, s, d) => {
    const div = document.createElement('div');
    div.className = 'row ' + s;
    div.innerHTML = '<div class="t">' + (s==='ok'?'✅':'❌') + ' ' + t + '</div>' + (d?'<div class="d"></div>':'');
    if (d) div.querySelector('.d').textContent = d;
    out.appendChild(div);
  };

  let session = {};
  try { session = JSON.parse(localStorage.getItem('tulungiyong.session')) || {}; } catch {}
  const uid = session.uid || session.id;

  // 1. Minimal (baseline)
  try {
    const ref = await addDoc(collection(db, 'orders'), {
      userId: uid, userName: session.name || 'Test', userWa: session.wa || '',
      serviceId: 'ojek', serviceName: 'Tes Minimal', status: 'pending',
      createdAt: serverTimestamp(), paymentMethod: 'cash', fare: 0, paymentTotal: 0
    });
    log('1. Order minimal (cash)', 'ok', 'BERHASIL id: ' + ref.id);
  } catch (e) { log('1. Order minimal (cash)', 'fail', e.code + '\n' + e.message); }

  // 2. Lengkap CASH (seperti ojek asli)
  try {
    const ref = await addDoc(collection(db, 'orders'), {
      userId: uid, userName: session.name || 'Test', userWa: session.wa || '',
      serviceId: 'ojek', serviceName: 'Ojek Online', status: 'pending',
      createdAt: serverTimestamp(), paymentMethod: 'cash',
      pickup: 'Jl. Tes', dest: 'Jl. Tujuan',
      pickupCoords: [-7.7956, 110.3695], destCoords: [-7.8, 110.37],
      pickupGeohash: 'qqq', distance: 2.5, fare: 11250, pricePerKm: 2500, paymentTotal: 11250
    });
    log('2. Order lengkap (cash)', 'ok', 'BERHASIL id: ' + ref.id);
  } catch (e) { log('2. Order lengkap (cash)', 'fail', e.code + '\n' + e.message); }

  // 3. Lengkap TRANSFER + kode unik
  try {
    const ref = await addDoc(collection(db, 'orders'), {
      userId: uid, userName: session.name || 'Test', userWa: session.wa || '',
      serviceId: 'ojek', serviceName: 'Ojek Online', status: 'pending',
      createdAt: serverTimestamp(), paymentMethod: 'transfer',
      pickup: 'Jl. Tes', dest: 'Jl. Tujuan',
      pickupCoords: [-7.7956, 110.3695], destCoords: [-7.8, 110.37],
      pickupGeohash: 'qqq', distance: 2.5, fare: 11250, pricePerKm: 2500,
      paymentTotal: 11123, uniqueCode: 123
    });
    log('3. Order lengkap (transfer + kode unik)', 'ok', 'BERHASIL id: ' + ref.id);
  } catch (e) { log('3. Order lengkap (transfer + kode unik)', 'fail', e.code + '\n' + e.message); }

  // 4. BECAK
  try {
    const ref = await addDoc(collection(db, 'orders'), {
      userId: uid, userName: session.name || 'Test', userWa: session.wa || '',
      serviceId: 'becak', serviceName: 'Becak Online', status: 'pending',
      createdAt: serverTimestamp(), paymentMethod: 'cash',
      pickup: 'Jl. Tes', dest: 'Jl. Tujuan',
      pickupCoords: [-7.7956, 110.3695], destCoords: [-7.8, 110.37],
      pickupGeohash: 'qqq', distance: 2.5, fare: 10000, pricePerKm: 2000, paymentTotal: 10000
    });
    log('4. Order BECAK (cash)', 'ok', 'BERHASIL id: ' + ref.id);
  } catch (e) { log('4. Order BECAK (cash)', 'fail', e.code + '\n' + e.message); }
};
</script>
</body>
</html>
